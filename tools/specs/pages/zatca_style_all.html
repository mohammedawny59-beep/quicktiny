  <style>
    .cl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
    .cl-grid input,.cl-grid select{width:100%}
    .cl-num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
    .cl-sec{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px;background:rgba(255,255,255,.02)}
    .cl-sec h2{margin:0 0 10px;font-size:15px;color:var(--text-dim)}
    .cl-out{margin-top:16px;padding:18px 20px;border-radius:18px;background:linear-gradient(135deg,rgba(107,107,255,.16),rgba(59,226,255,.06));border:1px solid rgba(123,123,255,.35)}
    .cl-rows{display:grid;gap:6px}
    .cl-row{display:flex;justify-content:space-between;gap:10px;font-size:15px}
    .cl-row b{font-variant-numeric:tabular-nums;direction:ltr}
    .cl-big{font-size:clamp(24px,4vw,34px);font-weight:800;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
    .cl-words{margin-top:8px;font:600 16px/1.8 "QT Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;color:#dfe2ff}
    .cl-note{font-size:13.5px;color:var(--text-dim);margin-top:10px;line-height:1.7}
    .vt-table{width:100%;border-collapse:collapse;margin-top:6px}
    .vt-table th{font-size:12.5px;color:var(--muted);text-align:start;font-weight:600;padding:4px}
    .vt-table td{padding:4px;vertical-align:middle}
    .vt-table input{width:100%;min-width:0}
    .vt-table td:nth-child(2){width:70px}.vt-table td:nth-child(3){width:120px}.vt-table td:nth-child(4){width:100px;font-variant-numeric:tabular-nums;direction:ltr;text-align:right;color:var(--text-dim);font-size:13px}.vt-table td:nth-child(5){width:34px}
    .vt-qty,.vt-price{direction:ltr;text-align:right}
    .vt-del{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;text-align:center;color:var(--muted)}
    .vt-del:hover{background:rgba(255,90,90,.15);color:#ff9a9a}
    @media(max-width:560px){.vt-table td:nth-child(1){display:none}.vt-table th:nth-child(1){display:none}.vt-table td:nth-child(4){width:80px}}
    .zk-res{margin-top:16px;padding:18px 20px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
    .zk-res.zk-due{background:linear-gradient(135deg,rgba(60,220,140,.14),rgba(59,226,255,.05));border-color:rgba(60,220,140,.4)}
    #esSteps{margin:10px 0 0;padding-inline-start:20px;font-size:14px;line-height:1.8;color:var(--text-dim)}
  </style>
  <style>
    #zvTabs{margin-bottom:16px}
    #tool{overflow:clip} /* keeps the preview sticky (overflow:hidden would break it) */
    #zvPrintArea{display:none}
    .zv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px}
    @media(max-width:980px){.zv-grid{grid-template-columns:minmax(0,1fr)}#zvPreview{position:static;overflow-x:auto;padding:18px 14px}}
    .zv-form .cl-grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
    .zv-err{color:#ff9a9a;font-size:12.5px;min-height:1px}
    .zv-items{width:100%;border-collapse:collapse}
    .zv-items td{padding:3px}.zv-items td:nth-child(2){width:64px}.zv-items td:nth-child(3){width:96px}.zv-items td:nth-child(4){width:34px}
    .zv-items input{width:100%;min-width:0}
    .zv-logo-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    #zvPayload{display:block;margin-top:6px;font:11.5px/1.5 var(--mono);word-break:break-all;color:var(--muted);direction:ltr;text-align:left}
    /* invoice paper */
    #zvPreview,#zvPrintArea{background:#fff;color:#111;border-radius:12px;padding:26px 26px 22px;font:13px/1.6 "QT Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif}
    #zvPreview{box-shadow:0 20px 50px -25px rgba(0,0,0,.8);position:sticky;top:84px;align-self:start}
    .iv-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:12px}
    .iv-seller{display:flex;gap:12px;align-items:flex-start}
    .iv-seller b{display:block;font-size:16px}.iv-seller span{display:block;color:#444;font-size:12px}
    .iv-logo{max-width:80px;max-height:80px;object-fit:contain}
    .iv-title{text-align:left}.iv-title h2{margin:0;font-size:17px;color:#111}.iv-title span{font-size:11px;color:#666}
    .iv-meta{display:flex;flex-wrap:wrap;gap:8px 26px;margin:12px 0}
    .iv-meta span{display:block;font-size:11px;color:#666}.iv-meta b{font-size:13px}.iv-meta small{display:block;color:#444}
    .iv-items{width:100%;border-collapse:collapse;font-size:12px}
    .iv-items th{background:#f1f1f4;color:#333;font-weight:700;padding:6px;text-align:right;border-bottom:1px solid #ccc}
    .iv-items td{padding:6px;border-bottom:1px solid #e3e3e3;vertical-align:top}
    .iv-items .n{direction:ltr;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
    .iv-empty{text-align:center;color:#999}
    .iv-foot{display:flex;justify-content:space-between;gap:18px;margin-top:14px;align-items:flex-start}
    .iv-qr svg{display:block}
    .iv-qr-ph{width:132px;height:132px;border:1px dashed #bbb;color:#888;font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;box-sizing:border-box}
    .iv-totals{flex:1;max-width:330px}
    .iv-totals div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee}
    .iv-totals b{direction:ltr;font-variant-numeric:tabular-nums}
    .iv-grand{font-size:15px;border-bottom:2px solid #111 !important}
    .iv-words{margin:8px 0 0;font-size:12px;color:#333}
    .iv-notes{margin:14px 0 0;padding-top:10px;border-top:1px dashed #ccc;color:#444;font-size:12px;white-space:pre-wrap}
    /* reader */
    .zr-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
    .zr-table th{text-align:start;color:var(--text-dim);font-weight:600;padding:8px;border-bottom:1px solid var(--line);width:44%}
    .zr-table td{padding:8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
    .zr-list{margin:12px 0 0;padding-inline-start:20px;font-size:14px;line-height:1.7}
    .zr-bad{color:#ffb3b3}.zr-ok{color:#9ff0c4}.zr-good{color:#7ff0b0;font-weight:700;margin-top:12px}
    #zrText{min-height:90px;font:13px/1.5 var(--mono);direction:ltr}
    @media print{
      @page{size:A4;margin:12mm}
      html,body{background:#fff !important}
      body > *:not(#zvPrintArea){display:none !important}
      #zvPrintArea{display:block !important;padding:0;border-radius:0}
    }
  </style>
