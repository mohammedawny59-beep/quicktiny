name: External asset health

# Every day, confirm the AI models (Hugging Face, pinned commits) and CDN libraries (jsDelivr) the site loads at
# runtime are still downloadable. A failure here means a tool is about to break — GitHub emails the repo owner.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  pull_request:
    paths: [asr-worker.js, clipper.js, tools/check_assets.mjs]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check external assets
        run: node tools/check_assets.mjs
